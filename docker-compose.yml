services:
  pade:
    build: ./pade-dir
    container_name: pade
    networks:
      - sim_net
    ports:
      - "5678:5678"
    # A MÁGICA ESTÁ AQUI: Mapeia diretamente a pasta pade_agents para /app
    volumes:
      - ./pade-dir/pade_agents:/app
    stdin_open: true
    tty: true
    # Agora ele encontra o ficheiro na raiz!
    command: python3 pade_sim.py

  omnet_sim:
    build: ./omnet-dir
    container_name: omnet_sim
    networks:
      - sim_net
    expose:
      - "5555"
    volumes:
      - ./omnet-dir:/root/models 
    command: /bin/bash -c "source /root/omnetpp/setenv && opp_makemake -f --deep -O out -o sim_exec -lzmq && make && ./sim_exec -u Cmdenv -c General"

  mosaik_master:
    build: ./mosaik-dir
    container_name: mosaik_master
    networks:
      - sim_net
    depends_on:
      - omnet_sim
      - pade
    volumes:
      - ./mosaik-dir:/app
    # 10 segundos de sleep para os agentes FIPA iniciarem em segurança
    command: sh -c "pip install pandas matplotlib && echo 'Aguardando o PADE arrancar...' && sleep 3 && python first.py && python plot_results.py"

networks:
  sim_net:
    driver: bridge