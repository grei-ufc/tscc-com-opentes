services:
  pade:
    build: ./pade-dir
    container_name: pade
    networks:
      - sim_net
    ports:
      - "5678:5678"
    volumes:
      - ./pade-dir/pade_agents:/app
    environment:
      # Recebe as variáveis do menu-streamlit.py (com valores fallback)
      - NUM_PERIFERICOS=${NUM_PERIFERICOS:-50}
      - TOPOLOGY=${TOPOLOGY:-estrela}
      - TIPOS_REDE=${TIPOS_REDE:-Link_Wired}
    stdin_open: true
    tty: true
    # Escolhe automaticamente o script PADE de acordo com a topologia
    # vinda do menu-streamlit.py: 'anel' usa pade_anel.py (vizinhança em ciclo),
    # qualquer outra topologia (estrela/malha) usa pade_star.py
    # (central + periféricos, difere apenas nas ligações do OMNeT++).
    command: >
      sh -c '
      if [ "$$TOPOLOGY" = "anel" ]; then
        echo "Topologia ANEL detectada -> iniciando pade_anel.py";
        python3 pade_anel.py;
      else
        echo "Topologia $$TOPOLOGY detectada -> iniciando pade_star.py";
        python3 pade_star.py;
      fi
      '

  omnet_sim:
    build: ./omnet-dir
    container_name: omnet_sim
    networks:
      - sim_net
    expose:
      - "5555"
    volumes:
      - ./omnet-dir:/root/models 
    # OMNeT++ compila e espera o arquivo DynamicNetwork.ned existir antes de rodar
    command: >
      /bin/bash -c "
      source /root/omnetpp/setenv && 
      opp_makemake -f --deep -o sim_exec -lzmq && 
      make && 
      echo 'Aguardando mosaik gerar DynamicNetwork.ned...' &&
      while [ ! -f DynamicNetwork.ned ]; do sleep 1; done && 
      echo 'Rede encontrada! Iniciando simulação...' &&
      ./sim_exec -u Cmdenv -c General"

  mosaik_master:
    build: ./mosaik-dir
    container_name: mosaik_master
    networks:
      - sim_net
    depends_on:
      - omnet_sim
      - pade
    volumes:
      - ./mosaik-dir:/app
      # Mosaik mapeia a pasta do OMNeT para poder injetar o .ned lá dentro
      - ./omnet-dir:/omnet-dir
    environment:
      # Recebe as variáveis do menu-streamlit.py para que o Mosaik gere o cenário corretamente
      - NUM_PERIFERICOS=${NUM_PERIFERICOS:-50}
      - TOPOLOGY=${TOPOLOGY:-estrela}
      - TIPOS_REDE=${TIPOS_REDE:-Link_Wired}
    # Tempo de sleep adaptado para o OMNeT++ compilar no start do container
    command: >
      sh -c "
      pip install pandas matplotlib && 
      echo 'Aguardando OMNeT++ compilar...' && 
      sleep 3 && 
      python scenario.py && 
      python plot_results_star.py"

networks:
  sim_net:
    driver: bridge