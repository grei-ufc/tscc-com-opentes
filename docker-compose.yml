services:

  # ─────────────────────────────────────────────
  # PADE: agentes multiagente (FIPA-ACL)
  # ─────────────────────────────────────────────
  pade:
    build: ./pade-dir
    container_name: pade
    networks:
      - sim_net
    ports:
      - "5678:5678"
    volumes:
      - ./pade-dir/pade_agents:/app
    environment:
      - TOPOLOGY=${TOPOLOGY:-estrela}
      - NUM_PERIFERICOS=${NUM_PERIFERICOS:-3}
      - TIPOS_REDE=${TIPOS_REDE:-Link_Wired,Link_5G,Link_Wireless,Link_4G,Link_2G}
    stdin_open: true
    tty: true
    # Seleciona o script PADE correto conforme a topologia:
    #   anel  → pade_anel.py  (vizinhança em ciclo)
    #   malha → pade_malha.py (broadcast total entre todos)
    #   demais→ pade_star.py  (central + periféricos)
    command: >
      sh -c '
      if [ "$$TOPOLOGY" = "anel" ]; then
        echo "Topologia ANEL -> pade_anel.py";
        python3 pade_anel.py;
      elif [ "$$TOPOLOGY" = "malha" ]; then
        echo "Topologia MALHA -> pade_malha.py";
        python3 pade_malha.py;
      else
        echo "Topologia $$TOPOLOGY -> pade_star.py";
        python3 pade_star.py;
      fi'

  # ─────────────────────────────────────────────
  # OMNET++: simulador de rede de comunicação (C++)
  # ─────────────────────────────────────────────
  omnet_sim:
    build: ./omnet-dir
    container_name: omnet_sim
    networks:
      - sim_net
    expose:
      - "5555"
    volumes:
      - ./omnet-dir:/root/models
    command: >
      /bin/bash -c "
      source /root/omnetpp/setenv &&
      rm -f /root/models/DynamicNetwork.ned &&
      cd /root/models &&
      opp_makemake -f --deep -o sim_exec -lzmq &&
      make &&
      echo 'Aguardando DynamicNetwork.ned...' &&
      while [ ! -f /root/models/DynamicNetwork.ned ]; do sleep 1; done &&
      echo 'Rede encontrada! Iniciando simulacao...' &&
      ./sim_exec -u Cmdenv -c General"

  # ─────────────────────────────────────────────
  # MOSAIK: orquestrador de co-simulação
  # ─────────────────────────────────────────────
  mosaik_master:
    build: ./mosaik-dir
    container_name: mosaik_master
    networks:
      - sim_net
    depends_on:
      - pade
      - omnet_sim
    volumes:
      - ./mosaik-dir:/app
      - ./omnet-dir:/omnet-dir
    environment:
      - TOPOLOGY=${TOPOLOGY:-estrela}
      - NUM_PERIFERICOS=${NUM_PERIFERICOS:-3}
      - TIPOS_REDE=${TIPOS_REDE:-Link_Wired,Link_5G,Link_Wireless,Link_4G,Link_2G}
    # Seleciona o script de plotagem correto conforme a topologia:
    #   malha → plot_results_malha.py (Plotly interativo + animação)
    #   demais→ plot_results_star.py  (matplotlib estático)
    command: >
      sh -c "
      pip install pandas matplotlib plotly kaleido &&
      echo 'Aguardando OMNeT++ compilar...' &&
      sleep 3 &&
      python scenario.py &&
      if [ \"$$TOPOLOGY\" = \"malha\" ]; then
        python plot_results_malha.py;
      else
        python plot_results_star.py;
      fi"

networks:
  sim_net:
    driver: bridge