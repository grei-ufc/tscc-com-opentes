services:

  # ─────────────────────────────────────────────
  # PADE: agentes multiagente (FIPA-ACL)
  # ─────────────────────────────────────────────
  pade:
    build: ./pade-dir
    container_name: pade
    networks:
      - sim_net
    ports:
      - "5678:5678"
    volumes:
      - ./pade-dir/pade_agents:/app
    environment:
      # ── comuns ──────────────────────────────
      - TOPOLOGY=${TOPOLOGY:-estrela}
      - NUM_PERIFERICOS=${NUM_PERIFERICOS:-3}
      - TIPOS_REDE=${TIPOS_REDE:-Link_Wired,Link_5G,Link_Wireless,Link_4G,Link_2G}
      - RANDOM_SEED=${RANDOM_SEED:-}
      - PADE_PORT=5678
      - PYTHONUNBUFFERED=1
      # ── topologia árvore ────────────────────
      - ARVORE_FANOUT=${ARVORE_FANOUT:-3,2,4}
      - CELULAR_ARVORE=${CELULAR_ARVORE:-4g}
      # ── topologia híbrida ───────────────────
      - SUBESTACOES=${SUBESTACOES:-3}
      - CONCENTRADORES=${CONCENTRADORES:-3}
      - MEDIDORES_CLUSTER=${MEDIDORES_CLUSTER:-5}
      - CELULAR_HIBRIDA=${CELULAR_HIBRIDA:-4g}
      - SEMENTE_HIBRIDA=${SEMENTE_HIBRIDA:-42}
    stdin_open: true
    tty: true
    # Seleciona o script PADE correto conforme a topologia:
    #   anel    → pade_anel.py    (vizinhança em ciclo)
    #   malha   → pade_malha.py   (todos enviam para todos)
    #   arvore  → pade_arvore.py  (árvore fan-out IEC 61850)
    #   hibrida → pade_hibrida.py (CCO + fibra + celular + RF mesh)
    #   demais  → pade_star.py    (central + periféricos)
    command: >
      sh -c '
      if [ "$$TOPOLOGY" = "anel" ]; then
        echo "Topologia ANEL -> pade_anel.py";
        python3 pade_anel.py;
      elif [ "$$TOPOLOGY" = "malha" ]; then
        echo "Topologia MALHA -> pade_malha.py";
        python3 pade_malha.py;
      elif [ "$$TOPOLOGY" = "arvore" ]; then
        echo "Topologia ARVORE -> pade_arvore.py";
        python3 pade_arvore.py;
      elif [ "$$TOPOLOGY" = "hibrida" ]; then
        echo "Topologia HIBRIDA -> pade_hibrida.py";
        python3 pade_hibrida.py;
      else
        echo "Topologia $$TOPOLOGY -> pade_star.py";
        python3 pade_star.py;
      fi'

  # ─────────────────────────────────────────────
  # OMNET++: simulador de rede de comunicação (C++)
  # ─────────────────────────────────────────────
  # omnet_sim e mosaik_master compartilham o namespace de rede do container
  # pade e se falam por 127.0.0.1. Isso evita a resolução de DNS entre
  # containers, que falha no Docker-in-Docker do GitHub Codespaces.
  omnet_sim:
    build: ./omnet-dir
    container_name: omnet_sim
    network_mode: "service:pade"
    depends_on:
      - pade
    volumes:
      - ./omnet-dir:/root/models
    environment:
      - RANDOM_SEED=${RANDOM_SEED:-}
      - PYTHONUNBUFFERED=1
    command: >
      /bin/bash -c "
      source /root/omnetpp/setenv &&
      rm -f /root/models/DynamicNetwork.ned &&
      cd /root/models &&
      opp_makemake -f --deep -o sim_exec -lzmq &&
      make &&
      echo 'Aguardando DynamicNetwork.ned...' &&
      while [ ! -f /root/models/DynamicNetwork.ned ]; do sleep 1; done &&
      echo 'Rede encontrada! Iniciando simulacao...' &&
      ./sim_exec -u Cmdenv -c General"

  # ─────────────────────────────────────────────
  # MOSAIK: orquestrador de co-simulação
  # ─────────────────────────────────────────────
  mosaik_master:
    build: ./mosaik-dir
    container_name: mosaik_master
    network_mode: "service:pade"
    depends_on:
      - pade
      - omnet_sim
    volumes:
      - ./mosaik-dir:/app
      - ./omnet-dir:/omnet-dir
    environment:
      # ── comuns ──────────────────────────────
      - TOPOLOGY=${TOPOLOGY:-estrela}
      - NUM_PERIFERICOS=${NUM_PERIFERICOS:-3}
      - TIPOS_REDE=${TIPOS_REDE:-Link_Wired,Link_5G,Link_Wireless,Link_4G,Link_2G}
      - RANDOM_SEED=${RANDOM_SEED:-}
      - SIM_STEPS=${SIM_STEPS:-20}
      - PADE_HOST=127.0.0.1
      - PADE_PORT=5678
      - OMNET_HOST=127.0.0.1
      - OMNET_PORT=5555
      - PYTHONUNBUFFERED=1
      # ── topologia árvore ────────────────────
      - ARVORE_FANOUT=${ARVORE_FANOUT:-3,2,4}
      - CELULAR_ARVORE=${CELULAR_ARVORE:-4g}
      # ── topologia híbrida ───────────────────
      - SUBESTACOES=${SUBESTACOES:-3}
      - CONCENTRADORES=${CONCENTRADORES:-3}
      - MEDIDORES_CLUSTER=${MEDIDORES_CLUSTER:-5}
      - CELULAR_HIBRIDA=${CELULAR_HIBRIDA:-4g}
      - SEMENTE_HIBRIDA=${SEMENTE_HIBRIDA:-42}
    # scenario.py já despacha o script de plotagem correto internamente:
    #   anel    → plot_results_anel.py
    #   malha   → plot_results_malha.py
    #   arvore  → plot_results_arvore.py
    #   hibrida → plot_results_hibrida.py
    #   demais  → plot_results_star.py
    # As dependências Python vêm da imagem (mosaik-dir/requirements.txt, travado pelo uv).
    command: >
      sh -c "
      rm -f /omnet-dir/DynamicNetwork.ned &&
      echo 'Aguardando OMNeT++ compilar...' &&
      sleep 3 &&
      python scenario.py"

networks:
  sim_net:
    driver: bridge
