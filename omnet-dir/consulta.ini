# =============================================================================
# CONSULTA POR MENSAGEM (OpenTES, mercado transativo sobre a IEEE 13 barras)
#
#   ./sim_exec -u Cmdenv -f consulta.ini
#
# A rede gerada por `python -m cosim.ieee13` tem um `servidorConsulta` no lugar
# do `mosaikBridge`: cada envio de um agente vira uma consulta ZMQ, e a mensagem
# atravessa os AgentNodes desta topologia. O omnetpp.ini (modo Mosaik) não muda.
# =============================================================================
[General]
network = DynamicNetwork
scheduler-class = "omnetpp::cSequentialScheduler"

# O tempo avança por consulta e não volta a zero: uma negociação soma milhões de
# segundos simulados. Em picossegundos o simtime_t estoura em cerca de 9,2e6 s;
# em nanossegundos, em 9,2e9 s.
simtime-resolution = ns
sim-time-limit = 1000000000s

# Semente fixa: os sorteios do MAC (TSCH e Wi-SUN) se repetem entre execuções.
seed-set = 0

**.agent_id = ""

# Roteamento: "etx" (menor número esperado de transmissões da mensagem, pelo
# tamanho dela, como na rede da tese) ou "saltos" (BFS, o do modo Mosaik). Na
# estrela os dois coincidem.
**.roteamento = "etx"
# Propagação nos meios não guiados: a da luz, 3,336 ns/m. O modo Mosaik mantém
# o valor original do repositório (50 µs/m, parâmetro propagacao_radio_s_m).
**.propagacao_radio_s_m = 3.336e-9
